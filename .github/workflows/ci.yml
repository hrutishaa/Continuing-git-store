name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: mvn -B verify

  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build community MinIO RELEASE.2025-10-15T17-29-55Z
        run: |
          git clone --depth 1 --branch RELEASE.2025-10-15T17-29-55Z https://github.com/minio/minio.git /tmp/minio-src
          (cd /tmp/minio-src && go build -o /tmp/minio .)
      - name: Start MinIO
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minio.log
          exit 1
      - name: MinIO conditional-write test
        run: mvn -B -Dtest=MinioWalIT -DfailIfNoTests=false test
        env:
          GITSTORE_MINIO_ENDPOINT: http://127.0.0.1:9000
          GITSTORE_MINIO_ACCESS_KEY: minioadmin
          GITSTORE_MINIO_SECRET_KEY: minioadmin
          GITSTORE_MINIO_BUCKET: gitstore-it
