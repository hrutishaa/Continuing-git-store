# Three stateless nodes in front of one MinIO bucket.
# MinIO is compiled from the AGPL tag RELEASE.2025-10-15T17-29-55Z.
# Later AIStor builds refuse S3 calls unless a license is installed.
services:
  minio:
    build:
      context: ./docker/minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  node-a:
    build: .
    depends_on:
      - minio
    environment:
      PORT: "8080"
      NODE_ID: node-a
      STORAGE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gitstore
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    ports:
      - "8080:8080"
    command: ["node"]

  node-b:
    build: .
    depends_on:
      - minio
    environment:
      PORT: "8080"
      NODE_ID: node-b
      STORAGE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gitstore
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    ports:
      - "8081:8080"
    command: ["node"]

  node-c:
    build: .
    depends_on:
      - minio
    environment:
      PORT: "8080"
      NODE_ID: node-c
      STORAGE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: gitstore
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    ports:
      - "8082:8080"
    command: ["node"]

volumes:
  minio-data:
